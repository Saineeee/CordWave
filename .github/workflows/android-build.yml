name: Android Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          mkdir -p "$ANDROID_SDK_ROOT/licenses" || true
          for dir in "$ANDROID_HOME/licenses" "$ANDROID_SDK_ROOT/licenses"; do
            [ -d "$dir" ] || continue
            printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a53fe443b788269e7d4c4e7d228\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$dir/android-sdk-license"
            printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a53fe443b788269e7d4c4e7d228\n" > "$dir/android-sdk-preview-license"
            printf "85622d5ae7d07180981310ac6e4f8701a96a2430\n" > "$dir/android-sdk-arm-dbt-license"
            printf "33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$dir/google-gdk-license"
            printf "e9acab5b5fbb560a725114ecaa70b5d7419ee5f6\n" > "$dir/mips-android-sysimage-license"
          done
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew || true

      - name: Prepare Environment & Debug Keystore
        run: |
          # Prepare .env file
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Decode or generate debug.keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 -d -i debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          # If debug.keystore is missing or empty, generate a valid key
          if [ ! -s debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
